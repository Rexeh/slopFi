[project]
name = "slopfi"
version = "0.1.0"
description = "slopFi: import your bank statements, see where the money goes, and project where you could be. Local-first, SQLite, no cloud."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymupdf>=1.26",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
slopfi = "slopfi.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
