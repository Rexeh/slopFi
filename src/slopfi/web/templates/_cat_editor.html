{#- The open category editor for one row (`r`). Rendered for uncategorised rows and errors; transactions.js clones
    the copy in <template id="cat-editor"> (id 0) into any other row, and adds the pattern field when "Make a rule" is ticked. -#}
<form class="cat-form" hx-post="/transactions/{{ r.id }}/category"><input list="cats" name="category" id="txn-{{ r.id }}-category"{% if value %} value="{{ value }}"{% endif %} placeholder="Choose a category" aria-label="Category" autocomplete="off"{% if error %} aria-invalid="true" aria-describedby="err-cat-{{ r.id }}"{% endif %}><button class="btn btn-sm">Save</button><label class="check small"><input type="checkbox" name="create_rule" autocomplete="off"> Make a rule</label>{% if error %}<span class="field-error" id="err-cat-{{ r.id }}">{{ error }}</span>{% endif %}</form>
